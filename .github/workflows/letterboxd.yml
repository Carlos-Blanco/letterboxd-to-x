name: Letterboxd to X

on:
  schedule:
    # Fuera del minuto :00, el de más carga: GitHub retrasa o descarta ahí
    # muchas ejecuciones programadas.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: letterboxd-to-x
  cancel-in-progress: false

jobs:
  post-new-ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Publish new ratings
        run: node src/index.js
        env:
          LETTERBOXD_RSS_URL: https://letterboxd.com/charlie_white/rss/
          X_OAUTH1_CONSUMER_KEY: ${{ secrets.X_OAUTH1_CONSUMER_KEY }}
          X_OAUTH1_CONSUMER_SECRET: ${{ secrets.X_OAUTH1_CONSUMER_SECRET }}
          X_OAUTH1_ACCESS_TOKEN: ${{ secrets.X_OAUTH1_ACCESS_TOKEN }}
          X_OAUTH1_ACCESS_TOKEN_SECRET: ${{ secrets.X_OAUTH1_ACCESS_TOKEN_SECRET }}
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}

      # También si falla la publicación: las entradas ya publicadas en esta
      # ejecución se volverían a publicar en la siguiente.
      - name: Save processed feed position
        if: ${{ !cancelled() }}
        run: |
          if ! git diff --quiet -- last-posted.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last-posted.json
            git commit -m "Update last processed Letterboxd entry"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
