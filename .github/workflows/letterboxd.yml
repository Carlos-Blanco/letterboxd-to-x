name: Letterboxd to X

on:
  # Respaldo: GitHub retrasa o descarta muchas ejecuciones programadas, sobre
  # todo en el minuto :00. El disparador fiable es cron-job.org, que llama a
  # workflow_dispatch cada 15 minutos (ver README).
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: letterboxd-to-x
  cancel-in-progress: false

jobs:
  post-new-ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # La punta de la rama, no el commit que había al dispararse: una
          # ejecución que esperaba en la cola de concurrencia debe ver el
          # last-posted.json que acaba de guardar la anterior.
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Publish new ratings
        run: node src/index.js
        env:
          LETTERBOXD_RSS_URL: https://letterboxd.com/charlie_white/rss/
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          # Opcional: sin él se usa la única cuenta de X conectada en Buffer.
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}

      # También si falla la publicación: las entradas ya publicadas en esta
      # ejecución se volverían a publicar en la siguiente.
      - name: Save processed feed position
        if: ${{ !cancelled() }}
        run: |
          if ! git diff --quiet -- last-posted.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last-posted.json
            git commit -m "Update last processed Letterboxd entry"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
