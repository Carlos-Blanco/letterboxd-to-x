name: Letterboxd to X

on:
  # Respaldo: GitHub retrasa o descarta muchas ejecuciones programadas, sobre
  # todo en el minuto :00. El disparador fiable es cron-job.org, que llama a
  # workflow_dispatch cada 15 minutos (ver README).
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  # Para el aviso de que el NPSSO de PlayStation está a punto de caducar.
  issues: write

concurrency:
  group: letterboxd-to-x
  cancel-in-progress: false

jobs:
  post-new-ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # La punta de la rama, no el commit que había al dispararse: una
          # ejecución que esperaba en la cola de concurrencia debe ver el
          # last-posted.json que acaba de guardar la anterior.
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Publish new ratings
        id: publish
        run: node src/index.js
        env:
          LETTERBOXD_RSS_URL: https://letterboxd.com/charlie_white/rss/
          GOODREADS_RSS_URL: https://www.goodreads.com/review/list_rss/68227397?shelf=read
          # Caduca a los dos meses; sin él no se consultan los trofeos (ver README).
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          # Opcional: sin él se usa la única cuenta de X conectada en Buffer.
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}

      # También si falla la publicación: las entradas ya publicadas en esta
      # ejecución se volverían a publicar en la siguiente.
      - name: Save processed feed position
        if: ${{ !cancelled() }}
        run: |
          # El patrón cubre last-posted.json, goodreads-posted.json y
          # psn-posted.json, también la primera vez que se crean.
          git add -- '*-posted.json'
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update posted entries"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      # Con 7 días o menos, abre un aviso asignado al propietario, que le llega
      # por correo. Se cierra solo al renovar el NPSSO, para que la próxima vez
      # vuelva a abrirse uno.
      - name: Warn before the PlayStation token expires
        if: ${{ !cancelled() && steps.publish.outputs.npsso_days_left != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS_LEFT: ${{ steps.publish.outputs.npsso_days_left }}
        run: |
          title="Renovar el NPSSO de PlayStation"
          open=$(gh issue list --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ "$DAYS_LEFT" -le 7 ]; then
            if [ -z "$open" ]; then
              body=$(printf '%s\n' \
                "Al NPSSO de PlayStation le quedan $DAYS_LEFT días. Cuando caduque, los platinos dejarán de publicarse hasta que lo renueves; los que consigas mientras tanto se publicarán después." \
                "" \
                "1. Inicia sesión en https://www.playstation.com." \
                "2. En el mismo navegador abre https://ca.account.sony.com/api/v1/ssocookie y copia el valor de \`npsso\`." \
                "3. Guárdalo en el secreto \`PSN_NPSSO\` (Settings → Secrets and variables → Actions)." \
                "" \
                "Este aviso se cierra solo cuando el bot detecta el NPSSO nuevo.")
              gh issue create --title "$title" --assignee "$GITHUB_REPOSITORY_OWNER" --body "$body"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "NPSSO renovado: le quedan $DAYS_LEFT días."
          fi
